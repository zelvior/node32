name: Experimental Windows x86

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/legacy-windows-x86.yml'
      - 'configure*'
      - 'vcbuild.bat'
      - '*.gyp*'
      - 'deps/**'
      - 'src/**'
      - 'lib/**'
      - 'test/parallel/test-legacy-32bit-smoke.js'
      - 'tools/legacy/**'

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      config_flags: --v8-disable-temporal-support
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Build experimental IA-32 executable
        shell: cmd
        run: vcbuild.bat x86 vs2022 openssl-no-asm no-cctest
      - name: Verify architecture and inspect imports
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path legacy-windows-x86 | Out-Null
          python tools/legacy/inspect-win-x86.py Release/node.exe | Out-File -Encoding utf8 legacy-windows-x86/imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content legacy-windows-x86/imports.txt
      - name: Smoke test on modern Windows
        shell: cmd
        run: |
          Release\node.exe -e "require('assert').strictEqual(process.arch, 'ia32')"
          if errorlevel 1 exit /b 1
          python tools\test.py --mode=release parallel/test-legacy-32bit-smoke
          if errorlevel 1 exit /b 1
      - name: Prepare experimental artifact
        shell: pwsh
        run: |
          Copy-Item Release/node.exe legacy-windows-x86/node.exe
          Copy-Item tools/legacy/smoke.js legacy-windows-x86/smoke.js
          Get-FileHash legacy-windows-x86/node.exe, legacy-windows-x86/smoke.js -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii legacy-windows-x86/SHA256.txt
          @(
            'Experimental build, not an official release. Windows 7 compatibility is not verified.',
            'Built on Windows Server 2022 with Temporal and OpenSSL assembly disabled.',
            "Source revision: $env:GITHUB_SHA"
          ) | Out-File -Encoding utf8 legacy-windows-x86/README.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: experimental-node-windows-x86
          path: legacy-windows-x86/
          if-no-files-found: error
          retention-days: 7
